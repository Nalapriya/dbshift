      join:
        joinCondition: "FROM {{ ref('ALCOBEV', 'STG_PRIMARY_SALES_ACTUALS') }} psa\nleft\
          \ join \n    {{ ref('ALCOBEV', 'DIM_COMPANY') }} cm \n    on psa.COMPANYCODE\
          \ = cm.COMPANYCODE\nleft join \n    {{ ref('ALCOBEV', 'DIM_GEOGRAPHY') }}\
          \ gm \n    on psa.STATECODE = gm.STATECODE\nleft join \n    {{ ref('ALCOBEV',\
          \ 'DIM_PRODUCT') }} pm \n    on psa.SKUCODE = pm.SKUCODE\nleft join \n \
          \   {{ ref('ALCOBEV', 'STG_PRIMARY_SALES_PLAN_AOP') }} psp \n    on psa.STATECODE\
          \ = psp.STATECODE and psa.SKUCODE = psp.SKUCODE\nleft join \n    {{ ref('ALCOBEV',\
          \ 'DIM_OUTLET') }} om \n    on psa.CUSTOMERCODE = om.OUTLET_CODE\nleft join\
          \ \n    {{ ref('ALCOBEV', 'STG_ACTIVATIONMASTER') }} am\n    on psa.SKUCODE\
          \ = am.PRODUCTLEVELCODE\nleft join \n    {{ ref('ALCOBEV', 'INT_ACTIVATIONMASTER_LATEST_DATE')\
          \ }} amr \n    on psa.SKUCODE = amr.PRODUCTLEVELCODE \n    and am.EFFECTIVEFROM\
          \ = amr.EFFECTIVEFROM\ngroup by \n    iff(psa.COMPANYCODE is null or psa.COMPANYCODE\
          \ = 'NULL', 'UNKNOWN', UPPER(TRIM(REPLACE(psa.COMPANYCODE, ' ', '')))),\n\
          \    iff(cm.COMPANYNAME is null or cm.COMPANYNAME = 'NULL', 'UNKNOWN', CONCAT(LEFT(TRIM(cm.COMPANYNAME),\
          \ 3), '***')),\n    iff(psa.STATECODE is null or psa.STATECODE = 'NULL',\
          \ 'UNKNOWN', LTRIM(RTRIM(psa.STATECODE))),\n    iff(gm.STATENAME is null\
          \ or gm.STATENAME = 'NULL', 'UNKNOWN', LOWER(TRIM(gm.STATENAME))),\n    iff(psa.SKUCODE\
          \ is null or psa.SKUCODE = 'NULL', 'UNKNOWN', SUBSTRING(LTRIM(RTRIM(psa.SKUCODE)),\
          \ 1, 10)),\n    iff(pm.ITEMNAME is null or pm.ITEMNAME = 'NULL', 'UNKNOWN',\
          \ REPLACE(TRIM(pm.ITEMNAME), ' ', '_')),\n    case \n        when om.ACTIVE_FLAG\
          \ = 1 then 'YES'\n        else 'NO'\n    end,\n    iff(am.PROMOTIONDESCRIPTION\
          \ is null or am.PROMOTIONDESCRIPTION = 'NULL', 'NO PROMOTION', CONCAT('Promo: ',\
          \ LTRIM(RTRIM(am.PROMOTIONDESCRIPTION)))),\n\n        iff(am.EFFECTIVEFROM\
          \ is null or am.EFFECTIVEFROM = 'NULL', '1900-01-01', TO_DATE(am.EFFECTIVEFROM,\
          \ 'yyyy-MM-dd')),\n\n        iff(am.EFFECTIVETO is null or am.EFFECTIVETO\
          \ = 'NULL', CURRENT_DATE, TO_DATE(am.EFFECTIVETO, 'yyyy-MM-dd'))"
