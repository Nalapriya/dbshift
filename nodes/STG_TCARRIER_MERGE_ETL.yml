                  (package_execution_guid, package_name, procedure_name, message, message_type, create_date)
              VALUES
                  ('{{ parameters.execution_guid }}', '{{ parameters.package_name }}', '{{ this }}', :ErrorMessage, 'E', CURRENT_TIMESTAMP());
              RAISE;
      END;
