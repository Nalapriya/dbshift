  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN
              LET _tbl  STRING := '{{this}}';
              LET _cnt  NUMBER;
              LET _msg  STRING;
              LET _type CHAR(1) := 'I';

              BEGIN
                -- Use dynamic SQL so it works whether the table exists yet or not
                LET _sql STRING := 'SELECT COUNT(*) CNT FROM IDENTIFIER(''' || :_tbl || ''')';
                EXECUTE IMMEDIATE :_sql;
                SELECT CNT INTO :_cnt FROM TABLE(RESULT_SCAN(LAST_QUERY_ID()));
                _msg := 'Profisee Table: ' || :_tbl || ' Rows: ' || TO_VARCHAR(:_cnt);
              EXCEPTION
                WHEN OTHER THEN
                  _msg  := 'Profisee Table: ' || :_tbl || ' not found';
                  _type := 'E';
              END;

              INSERT INTO MDM_Alliant_Stage.ETL.MESSAGE
              (package_execution_guid, package_name, procedure_name, message, message_type, create_date)
              VALUES (
                'run-2025-09-19-001',
                '{{ parameters.package_name }}',
                '{{this}}',
                :_msg,
                :_type,
                CURRENT_TIMESTAMP()
              );

              INSERT INTO MDM_Alliant_Stage.ETL.MESSAGE
              (package_execution_guid, package_name, procedure_name, message,  message_type, create_date)
              VALUES (
                '{{ parameters.execution_guid }}',
                '{{ parameters.package_name }}',
                '{{ this }}',
                'Finished',
                'I',
                CURRENT_TIMESTAMP()
              );

              EXCEPTION
              WHEN OTHER THEN
                INSERT INTO MDM_ALLIANT_STAGE.ETL.MESSAGE
                  (package_execution_guid, package_name, procedure_name, message, message_type, create_date)
                VALUES
                  ('{{ parameters.execution_guid }}','{{ parameters.package_name }}','{{ this }}',
                   '{{ this }} failed: ' || ERROR_MESSAGE(),'E', CURRENT_TIMESTAMP());
                RAISE;
            END;
