  config:
    insertStrategy: INSERT
    postSQL: |-
      BEGIN
          LET _tbl STRING := '{{this}}';
          LET _cnt NUMBER;
          LET _msg STRING;
          LET _type CHAR(1) := 'I';
          LET _sql STRING;
          LET ErrorMessage STRING;

          BEGIN
              _sql := 'SELECT COUNT(*) CNT FROM IDENTIFIER(''' || :_tbl || ''')';
              EXECUTE IMMEDIATE :_sql;
              SELECT CNT INTO :_cnt FROM TABLE(RESULT_SCAN(LAST_QUERY_ID()));
              _msg := 'Profisee Table (after insert): ' || :_tbl || ' Rows: ' || TO_VARCHAR(:_cnt);
          EXCEPTION
              WHEN OTHER THEN
                  _msg := 'Profisee Table (after insert): ' || :_tbl || ' not found';
                  _type := 'W';
          END;

          INSERT INTO MDM_ALLIANT_STAGE.ETL.MESSAGE
              (package_execution_guid, package_name, procedure_name, message, message_type, create_date)
          VALUES
              ('{{ parameters.execution_guid }}', '{{ parameters.package_name }}', '{{ this }}', :_msg, :_type, CURRENT_TIMESTAMP());

          INSERT INTO MDM_ALLIANT_STAGE.ETL.MESSAGE
              (package_execution_guid, package_name, procedure_name, message, message_type, create_date)
          VALUES
              ('{{ parameters.execution_guid }}', '{{ parameters.package_name }}', '{{ this }}', 'Finished', 'I', CURRENT_TIMESTAMP());

      EXCEPTION
          WHEN OTHER THEN
              ErrorMessage := 'Entity: Carrier, Source: EPIC - could not insert to staging, SQL Error: ' || ERROR_MESSAGE();
